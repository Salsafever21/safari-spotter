# XcodeGen-Spezifikation: `brew install xcodegen` und im Ordner ios/ `xcodegen generate`, dann SafariSpotter.xcodeproj öffnen.
name: SafariSpotter
options:
  bundleIdPrefix: ch.solution21
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"   # Xcode akzeptiert nur 4.0, 4.2, 5.0, 6.0 (Sprachmodus, nicht Compilerversion)
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: PH2JE4682T
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_INTERFACE_ORIENTATIONS: "UIInterfaceOrientationPortrait"
    COREML_CODEGEN_LANGUAGE: Swift
targets:
  SafariSpotter:
    type: application
    platform: iOS
    sources:
      - path: SafariSpotter
      # Core-ML-Modelle einzeln als Dateireferenz (ein .mlpackage ist ein Ordner und darf nicht aufgeklappt werden);
      # Xcode kompiliert sie in der Sources-Phase und erzeugt die Swift-Klassen SafariSpotterDetector / SafariSpotterSpecies.
      # Eigener YOLO-Detektor (training/yolo/README.md): erst wenn die Datei existiert, hier eine weitere Zeile
      #   - { path: Models/SafariSpotterYolo.mlpackage, type: file, buildPhase: sources }
      # eintragen; eine Referenz auf eine fehlende Datei würde den Build abbrechen.
      - path: Models/SafariSpotterDetector.mlmodel
        type: file
        buildPhase: sources
      - path: Models/SafariSpotterSpecies.mlpackage
        type: file
        buildPhase: sources
    scheme:
      testTargets: [SafariSpotterTests]
    info:
      path: SafariSpotter/Info.plist
      properties:
        CFBundleDisplayName: Safari Spotter
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location]
        NSCameraUsageDescription: Die Kamera erkennt Tiere live im Bild.
        NSMicrophoneUsageDescription: Für den Ton in Videoaufnahmen.
        NSLocationWhenInUseUsageDescription: Standort für Sichtungen, Region und die Game-Drive-Aufzeichnung.
        NSLocationAlwaysAndWhenInUseUsageDescription: Damit die Game-Drive-Aufzeichnung auch weiterläuft, wenn das iPhone gesperrt ist.
        NSPhotoLibraryAddUsageDescription: Zum Sichern der Fotos mit Standort und Datum in deine Mediathek.
        NSPhotoLibraryUsageDescription: Zum Analysieren von Bildern aus der Mediathek.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.solution21.safarispotter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
  # Unit-Tests (Bildausschnitte, Artenschutz, Korrektur): im Simulator mit
  #   xcodebuild -scheme SafariSpotter -destination 'platform=iOS Simulator,name=iPhone 16' test
  SafariSpotterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SafariSpotterTests
    dependencies:
      - target: SafariSpotter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ch.solution21.safarispotter.tests
